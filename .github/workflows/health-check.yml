name: Scraper Health Check

on:
  schedule:
    - cron: '0 14 * * *' # Run daily at 14:00 UTC (9:00 AM EST)
  workflow_dispatch: # Allow manual trigger

jobs:
  health-check:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Install Playwright browsers
      run: npx playwright install --with-deps chromium
      
    - name: Run Scraper in Test Mode
      env:
        DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        NODE_ENV: production
        LOG_LEVEL: debug
        # Using a specific config for health check if needed, or just relying on default
        # For now, running the main scraper but we expect it to succeed.
        # If it fails (due to strict validation), the job will fail.
      run: npm start
      
    - name: Notify on Failure
      if: failure()
      uses: actions/github-script@v6
      env:
        DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      with:
        script: |
          const webhookUrl = process.env.DISCORD_WEBHOOK;
          if (!webhookUrl) return;
          
          const message = {
            embeds: [{
              title: '🚨 Scraper Health Check Failed',
              description: 'The daily health check failed. This likely means selectors are broken or the site structure has changed.',
              color: 0xFF0000,
              fields: [
                { name: 'Workflow', value: 'Health Check', inline: true },
                { name: 'Run ID', value: context.runId.toString(), inline: true },
                { name: 'Link', value: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`, inline: false }
              ],
              timestamp: new Date().toISOString()
            }]
          };
          
          await fetch(webhookUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(message)
          });
