# Product Configuration for Deal Scraper
# Add specific product URLs or category pages to monitor

# Global alert settings - lowered for testing
alerts:
  min_discount_percent: 1  # Very low threshold to test alerts
  discord_enabled: false
  deduplication_hours: 24

# Output settings
output:
  data_directory: "data"
  git_commit: true

# Retailer configurations
retailers:
  petsmart:
    enabled: true
    products:
      # Real test product for validation - low threshold for testing alerts
      - name: "Authority Everyday Health Adult Cat Wet Food - 5.5 Oz"
        url: "https://www.petsmart.ca/cat/food-and-treats/wet-food/authority-everyday-health-adult-cat-wet-food---55-oz-flaked-in-gravy-51010.html"
        alert_threshold: 1
      - name: "Natural Balance Limited Ingredient Wet Cat Food - Pate, 5.5 oz."
        url: "https://www.petsmart.ca/cat/food-and-treats/wet-food/natural-balance-limited-ingredient-diets-cat-food---grain-free-chicken-and-green-pea-30327.html"
        alert_threshold: 1

  petvalu:
    enabled: false  # Disabled for MVP - single site first
    products: []

  shoppers:
    enabled: false  # Disabled for MVP - single site first  
    products: []

  quiverquant:
    enabled: true
    alert_on_new: true
    products:
      - name: "Nancy Pelosi Trading"
        url: "https://www.quiverquant.com/congresstrading/politician/Nancy%20Pelosi-P000197"
      - name: "Marjorie Taylor Greene Trading"
        url: "https://www.quiverquant.com/congresstrading/politician/Marjorie%20Taylor%20Greene-G000596"
        alert_threshold: 0

